<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sơ đồ hoạt động - Tạo yêu cầu thu gom (UC04)</title>
  <style>
    body { margin: 24px; font-family: 'Segoe UI', sans-serif; background: #fff; }
    h1 { font-size: 16px; color: #1565C0; }
    .note { font-size: 12px; color: #444; max-width: 920px; line-height: 1.5; margin-bottom: 12px; }
    svg { display: block; border: 1px solid #87CEEB; background: #fff; }
    .swim { fill: #1565C0; font-weight: bold; font-size: 14px; }
    .box { fill: #fff; stroke: #87CEEB; stroke-width: 2; }
    .dia { fill: #fff; stroke: #87CEEB; stroke-width: 2; }
    .start { fill: #1565C0; }
    .end { fill: #fff; stroke: #1565C0; stroke-width: 3; }
    .t { fill: #1565C0; font-size: 11px; text-anchor: middle; }
    .ts { fill: #1565C0; font-size: 9.5px; text-anchor: middle; }
    .ar { stroke: #1976D2; stroke-width: 1.8; fill: none; marker-end: url(#m); }
    .lb { fill: #1976D2; font-size: 10px; }
  </style>
</head>
<body>
  <h1>Sơ đồ hoạt động — Tạo yêu cầu thu gom (UC04)</h1>
  <p class="note">
    Theo đặc tả: bước 1–10; luồng 5a (không ảnh → nhập tay); luồng 7a (thiếu dữ liệu → lỗi → quay form bước 2).
    Màu: viền <code>#87CEEB</code>, mũi tên <code>#1976D2</code> (đồng bộ sơ đồ Đăng nhập).
  </p>

  <svg width="900" height="1140" viewBox="0 0 900 1140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="m" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2" />
      </marker>
    </defs>

    <rect x="30" y="42" width="390" height="1070" fill="#F8FCFF" stroke="#B3E5FC"/>
    <rect x="420" y="42" width="450" height="1070" fill="#FAFAFA" stroke="#B3E5FC"/>
    <text x="225" y="30" class="swim" text-anchor="middle">Khách hàng</text>
    <text x="645" y="30" class="swim" text-anchor="middle">Hệ thống</text>

    <circle cx="225" cy="78" r="8" class="start"/>
    <line x1="225" y1="86" x2="225" y2="108" class="ar"/>

    <rect x="95" y="108" width="260" height="40" rx="10" class="box"/>
    <text x="225" y="132" class="t">1. Truy cập tạo yêu cầu thu gom</text>
    <line x1="355" y1="128" x2="455" y2="128" class="ar"/>

    <rect x="455" y="95" width="380" height="66" rx="10" class="box"/>
    <text x="645" y="122" class="t">2. Hiển thị form nhập thông tin</text>
    <text x="645" y="140" class="ts">loại rác, số lượng, địa chỉ, ngày hẹn, ghi chú</text>
    <polyline points="645,161 645,188 225,188 225,208" class="ar"/>

    <rect x="95" y="208" width="260" height="44" rx="10" class="box"/>
    <text x="225" y="234" class="t">3. Chọn loại rác, nhập số lượng ước tính</text>
    <line x1="225" y1="252" x2="225" y2="278" class="ar"/>

    <path d="M 225 278 L 282 328 L 225 378 L 168 328 Z" class="dia"/>
    <text x="225" y="326" class="t">Tải ảnh?</text>

    <line x1="282" y1="328" x2="335" y2="328" class="ar"/>
    <text x="305" y="320" class="lb">Có</text>
    <rect x="335" y="303" width="100" height="50" rx="8" class="box"/>
    <text x="385" y="333" class="ts">4. Tải ảnh rác</text>
    <line x1="435" y1="328" x2="475" y2="328" class="ar"/>
    <rect x="475" y="288" width="330" height="80" rx="10" class="box"/>
    <text x="640" y="318" class="t">5. AI phân tích ảnh</text>
    <text x="640" y="336" class="ts">gợi ý loại rác, tự điền</text>
    <!-- AI hợp nhất vào bước 6 (không qua 5a) -->
    <polyline points="640,368 640,410 225,410 225,502" class="ar"/>

    <!-- Không tải ảnh → 5a → bước 6 -->
    <polyline points="168,328 55,328 55,458 95,458" class="ar"/>
    <text x="48" y="320" class="lb">Không</text>
    <rect x="95" y="438" width="260" height="40" rx="10" class="box"/>
    <text x="225" y="462" class="ts">5a. Nhập thủ công loại rác</text>
    <line x1="225" y1="478" x2="225" y2="502" class="ar"/>

    <rect x="95" y="502" width="260" height="52" rx="10" class="box"/>
    <text x="225" y="526" class="t">6. Nhập địa chỉ thu gom</text>
    <text x="225" y="542" class="ts">và thông tin khác</text>
    <line x1="225" y1="554" x2="225" y2="580" class="ar"/>

    <rect x="95" y="580" width="260" height="40" rx="10" class="box"/>
    <text x="225" y="604" class="t">7. Xác nhận và gửi yêu cầu</text>
    <line x1="355" y1="600" x2="515" y2="600" class="ar"/>

    <path d="M 640 552 L 698 600 L 640 648 L 582 600 Z" class="dia"/>
    <text x="640" y="595" class="ts">Đủ thông tin</text>
    <text x="640" y="608" class="ts">bắt buộc?</text>

    <line x1="698" y1="600" x2="770" y2="600" class="ar"/>
    <text x="728" y="592" class="lb">Sai</text>
    <rect x="770" y="578" width="100" height="44" rx="8" class="box"/>
    <text x="820" y="598" class="ts">7a. Hiển thị lỗi</text>
    <text x="820" y="612" class="ts">bổ sung</text>
    <polyline points="820,578 820,78 645,78 645,95" class="ar"/>

    <line x1="640" y1="648" x2="640" y2="688" class="ar"/>
    <text x="652" y="672" class="lb">Đúng</text>
    <rect x="490" y="688" width="300" height="38" rx="10" class="box"/>
    <text x="640" y="711" class="t">8. Lưu yêu cầu — PENDING</text>
    <line x1="640" y1="726" x2="640" y2="752" class="ar"/>
    <rect x="490" y="752" width="300" height="48" rx="10" class="box"/>
    <text x="640" y="776" class="t">9. Thông báo thành công</text>
    <text x="640" y="792" class="ts">và thông tin yêu cầu</text>
    <line x1="640" y1="800" x2="640" y2="828" class="ar"/>
    <circle cx="640" cy="845" r="12" class="end"/>
    <circle cx="640" cy="845" r="7" fill="#1565C0"/>
    <text x="640" y="875" class="ts">10. Kết thúc</text>
  </svg>
</body>
</html>
