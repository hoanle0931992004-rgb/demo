<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biểu đồ tuần tự — Đăng nhập (UC02)</title>
  <style>
    body { margin: 16px; font-family: 'Segoe UI', sans-serif; background: #fff; }
    p { font-size: 12px; color: #444; max-width: 1100px; }
    svg { display: block; border: 1px solid #87CEEB; background: #FEFEFE; }
    .life { stroke: #1976D2; stroke-width: 2; }
    .msg { stroke: #1976D2; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .ret { stroke: #1976D2; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; marker-end: url(#arr); }
    .box { fill: #fff; stroke: #87CEEB; stroke-width: 2; }
    .t { fill: #1565C0; font-size: 10px; }
    .th { fill: #1565C0; font-weight: bold; font-size: 12px; }
    .alt { fill: #FFF8E1; stroke: #FFB74D; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .alt-t { fill: #E65100; font-size: 9px; font-weight: bold; }
  </style>
</head>
<body>
  <p><strong>Biểu đồ tuần tự — Đăng nhập</strong> (Người dùng, Form trang chủ, Form đăng nhập, Control đăng nhập, CSDL). Mở file trong trình duyệt → chụp màn hình hoặc In → PDF.</p>

  <svg width="1040" height="920" viewBox="0 0 1040 920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2" />
      </marker>
    </defs>

    <text x="520" y="28" class="th" text-anchor="middle">Biểu đồ tuần tự — Đăng nhập (UC02)</text>

    <!-- Participants -->
    <rect x="40" y="48" width="140" height="36" rx="8" class="box"/>
    <text x="110" y="72" class="th" text-anchor="middle">Người dùng</text>
    <rect x="220" y="48" width="140" height="36" rx="8" class="box"/>
    <text x="290" y="64" class="th" text-anchor="middle">Form</text>
    <text x="290" y="78" class="t" text-anchor="middle">Trang chủ</text>
    <rect x="400" y="48" width="140" height="36" rx="8" class="box"/>
    <text x="470" y="64" class="th" text-anchor="middle">Form</text>
    <text x="470" y="78" class="t" text-anchor="middle">Đăng nhập</text>
    <rect x="580" y="48" width="160" height="36" rx="8" class="box"/>
    <text x="660" y="64" class="th" text-anchor="middle">Control</text>
    <text x="660" y="78" class="t" text-anchor="middle">Đăng nhập</text>
    <rect x="780" y="48" width="140" height="36" rx="8" class="box"/>
    <text x="850" y="72" class="th" text-anchor="middle">CSDL</text>

    <!-- Lifelines -->
    <line x1="110" y1="84" x2="110" y2="880" class="life"/>
    <line x1="290" y1="84" x2="290" y2="880" class="life"/>
    <line x1="470" y1="84" x2="470" y2="880" class="life"/>
    <line x1="660" y1="84" x2="660" y2="880" class="life"/>
    <line x1="850" y1="84" x2="850" y2="880" class="life"/>

    <!-- 1-2 -->
    <line x1="110" y1="120" x2="290" y2="120" class="msg"/>
    <text x="200" y="114" class="t" text-anchor="middle">1. Truy cập trang chủ</text>
    <line x1="290" y1="148" x2="110" y2="148" class="ret"/>
    <text x="200" y="142" class="t" text-anchor="middle">2. Hiển thị giao diện trang chủ</text>

    <!-- 3-4 -->
    <line x1="110" y1="188" x2="290" y2="188" class="msg"/>
    <text x="200" y="182" class="t" text-anchor="middle">3. Chọn Đăng nhập</text>
    <line x1="290" y1="216" x2="470" y2="216" class="msg"/>
    <text x="380" y="210" class="t" text-anchor="middle">4. Điều hướng mở form đăng nhập</text>
    <line x1="470" y1="244" x2="110" y2="244" class="ret"/>
    <text x="290" y="238" class="t" text-anchor="middle">5. Hiển thị form email, mật khẩu</text>

    <!-- 6-7 -->
    <line x1="110" y1="284" x2="470" y2="284" class="msg"/>
    <text x="290" y="278" class="t" text-anchor="middle">6. Nhập email, mật khẩu và gửi</text>
    <line x1="470" y1="312" x2="660" y2="312" class="msg"/>
    <text x="565" y="306" class="t" text-anchor="middle">7. Gửi yêu cầu đăng nhập</text>

    <!-- 8-9 -->
    <line x1="660" y1="352" x2="850" y2="352" class="msg"/>
    <text x="755" y="346" class="t" text-anchor="middle">8. Truy vấn theo email</text>
    <line x1="850" y1="380" x2="660" y2="380" class="ret"/>
    <text x="755" y="374" class="t" text-anchor="middle">9. Trả về bản ghi / không có</text>

    <!-- Alt frame -->
    <rect x="60" y="410" width="920" height="420" class="alt" rx="6"/>
    <text x="80" y="432" class="alt-t">alt — Xác thực (theo UC02)</text>

    <text x="80" y="460" class="t">[Đúng email &amp; mật khẩu, chưa khóa]</text>
    <line x1="660" y1="478" x2="660" y2="506" class="life"/>
    <text x="700" y="498" class="t" text-anchor="start">Kiểm tra bi_khoa, tạo phiên (JWT/session)</text>
    <line x1="660" y1="520" x2="470" y2="520" class="ret"/>
    <text x="565" y="514" class="t" text-anchor="middle">10. Thành công + token + vai trò</text>
    <line x1="470" y1="548" x2="110" y2="548" class="ret"/>
    <text x="290" y="542" class="t" text-anchor="middle">11. Chuyển hướng trang chủ theo vai trò</text>

    <text x="80" y="590" class="t">[Sai email hoặc mật khẩu]</text>
    <line x1="660" y1="608" x2="470" y2="608" class="ret"/>
    <text x="565" y="602" class="t" text-anchor="middle">Lỗi xác thực</text>
    <line x1="470" y1="636" x2="110" y2="636" class="ret"/>
    <text x="290" y="630" class="t" text-anchor="middle">Thông báo sai thông tin (3a)</text>

    <text x="80" y="678" class="t">[Đúng nhưng tài khoản bị khóa]</text>
    <line x1="660" y1="696" x2="470" y2="696" class="ret"/>
    <text x="565" y="690" class="t" text-anchor="middle">Lỗi khóa tài khoản</text>
    <line x1="470" y1="724" x2="110" y2="724" class="ret"/>
    <text x="290" y="718" class="t" text-anchor="middle">Thông báo tài khoản bị khóa (4a)</text>

    <text x="520" y="800" class="t" text-anchor="middle">Kết thúc luồng gửi yêu cầu — phiên được tạo khi đăng nhập thành công (UC02)</text>
  </svg>
</body>
</html>
